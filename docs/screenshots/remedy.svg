<svg xmlns="http://www.w3.org/2000/svg" width="902" height="712" viewBox="0 0 902 712" role="img" aria-label="Remedy — engine diagnoses, ranked recommendations, and the ledger’s verdict">
<title>Remedy — engine diagnoses, ranked recommendations, and the ledger’s verdict</title>
<rect width="902" height="712" rx="8" fill="#0d1117"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" xml:space="preserve">
<text x="14" y="27.0" textLength="873.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">ZWAVE·JS MESH DIAGNOSTICS</tspan><tspan fill="#e6edf3">                               </tspan><tspan fill="#3fb950">●</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#3fb950">ONLINE</tspan><tspan fill="#7d8590">   </tspan><tspan fill="#7d8590">HOME </tspan><tspan fill="#e6edf3">3237998081</tspan><tspan fill="#7d8590">   </tspan><tspan fill="#7d8590">2026-05-14 02:41:00</tspan></text>
<text x="14" y="45.0" textLength="873.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#39c5cf">── </tspan><tspan fill="#e6edf3" font-weight="700">REMEDY</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#39c5cf">──────────────────────────────────────────────────────────────────────────────────</tspan><tspan fill="#e6edf3">  3 symptoms</tspan></text>
<text x="14" y="63.0" textLength="638.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#7d8590">  </tspan><tspan fill="#ff7b72" font-weight="700">2 critical</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#d29922">1 warning</tspan><tspan fill="#7d8590">  —  the engine only recommends; you run the actions</tspan></text>
<text x="14" y="99.0" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">▶ </tspan><tspan fill="#ff7b72" font-weight="700">CRIT</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#3fb950">◆</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">dead-flap</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#39c5cf">#83 Utility Closet Switch</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#7d8590">2h</tspan></text>
<text x="14" y="117.0" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#3fb950">measured</tspan></text>
<text x="14" y="135.0" textLength="764.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">○ 3 past episodes of this kind could not be scored — too few readings to judge recovery</tspan></text>
<text x="14" y="153.0" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">Alive↔Dead 6× in 2 h; currently dead for 3 h.</tspan></text>
<text x="14" y="171.0" textLength="604.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#39c5cf">▎ </tspan><tspan fill="#e6edf3">Reachability runbook — a rebuild cannot repair an unreachable node</tspan></text>
<text x="14" y="189.0" textLength="504.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">      </tspan><tspan fill="#3fb950">▸</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">Ping the node (reachability request)</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">[</tspan><tspan fill="#3fb950">safe</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">source</tspan><tspan fill="#7d8590">]</tspan></text>
<text x="14" y="207.0" textLength="873.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">        </tspan><tspan fill="#7d8590">Sends a ping request. HA does not return the result, so watch the node&#39;s status/last-seen right </tspan></text>
<text x="14" y="225.0" textLength="445.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">        </tspan><tspan fill="#3fb950">✓ helped 71% (n=7 · 3 nodes) vs 22% self-heal</tspan></text>
<text x="14" y="243.0" textLength="739.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">      </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">Power-cycle the device, then exclude/re-include if it persists</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">[</tspan><tspan fill="#58a6ff">physical</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">lore</tspan><tspan fill="#7d8590">]</tspan></text>
<text x="14" y="279.0" textLength="495.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72" font-weight="700">CRIT</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#3fb950">◆</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">return-path-degraded</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#39c5cf">#70 Basement Leak Sensor</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#7d8590">5h</tspan></text>
<text x="14" y="297.0" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#3fb950">measured</tspan></text>
<text x="14" y="315.0" textLength="697.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">Reply-timeout rate 8.2% vs a 0.9% baseline for this time of day, sustained 5 h.</tspan></text>
<text x="14" y="333.0" textLength="562.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#39c5cf">▎ </tspan><tspan fill="#e6edf3">Improve the RF path — a repeater or relocation, not a rebuild</tspan></text>
<text x="14" y="351.0" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">      </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">Add/relocate a repeater on an interior path</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">[</tspan><tspan fill="#58a6ff">physical</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">lore</tspan><tspan fill="#7d8590">]</tspan></text>
<text x="14" y="369.0" textLength="873.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">        </tspan><tspan fill="#7d8590">A device far from the controller or behind an RF-hostile wall (metal, foil, stucco-over-lath) is</tspan></text>
<text x="14" y="387.0" textLength="520.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">      </tspan><tspan fill="#3fb950">▸</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">Refresh values (re-poll, non-mutating)</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">[</tspan><tspan fill="#3fb950">safe</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">source</tspan><tspan fill="#7d8590">]</tspan></text>
<text x="14" y="405.0" textLength="856.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">      </tspan><tspan fill="#7d8590">▸</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">Rebuild routes — NOT recommended here</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">[</tspan><tspan fill="#d29922">disruptive</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">source</tspan><tspan fill="#7d8590">]</tspan><tspan fill="#7d8590">  ⊘ no topology change — won’t help</tspan></text>
<text x="14" y="423.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">        </tspan><tspan fill="#d29922">⚠ ledger measured 64% here (n=11 · 3 nodes) vs 19% self-heal — the block above still applies</tspan></text>
<text x="14" y="459.0" textLength="420.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#d29922">WARN</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#3fb950">◆</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">weak-signal</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#39c5cf">#61 Patio String Lights</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#7d8590">26h</tspan></text>
<text x="14" y="477.0" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#3fb950">measured</tspan></text>
<text x="14" y="495.0" textLength="823.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#d29922">⚠ this detector has been refused as a misdiagnosis 2×</tspan><tspan fill="#7d8590"> — weigh the evidence above before acting</tspan></text>
<text x="14" y="513.0" textLength="621.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">SNR margin +12 dB over the live noise floor — two hops, both marginal.</tspan></text>
<text x="14" y="531.0" textLength="562.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#39c5cf">▎ </tspan><tspan fill="#e6edf3">Improve the RF path — a repeater or relocation, not a rebuild</tspan></text>
<text x="14" y="549.0" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">      </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">Add/relocate a repeater on an interior path</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">[</tspan><tspan fill="#58a6ff">physical</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">lore</tspan><tspan fill="#7d8590">]</tspan></text>
<text x="14" y="567.0" textLength="873.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">        </tspan><tspan fill="#7d8590">A device far from the controller or behind an RF-hostile wall (metal, foil, stucco-over-lath) is</tspan></text>
<text x="14" y="585.0" textLength="520.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">      </tspan><tspan fill="#3fb950">▸</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">Refresh values (re-poll, non-mutating)</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">[</tspan><tspan fill="#3fb950">safe</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">source</tspan><tspan fill="#7d8590">]</tspan></text>
<text x="14" y="603.0" textLength="856.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">      </tspan><tspan fill="#7d8590">▸</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3">Rebuild routes — NOT recommended here</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">[</tspan><tspan fill="#d29922">disruptive</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">source</tspan><tspan fill="#7d8590">]</tspan><tspan fill="#7d8590">  ⊘ no topology change — won’t help</tspan></text>
<text x="14" y="621.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">        </tspan><tspan fill="#d29922">⚠ ledger measured 64% here (n=11 · 3 nodes) vs 19% self-heal — the block above still applies</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="902" height="892" viewBox="0 0 902 892" role="img" aria-label="Engine — auto-ping, the refresh trial, and what the ledger has learned">
<title>Engine — auto-ping, the refresh trial, and what the ledger has learned</title>
<rect width="902" height="892" rx="8" fill="#0d1117"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" xml:space="preserve">
<text x="14" y="27.0" textLength="873.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">ZWAVE·JS MESH DIAGNOSTICS</tspan><tspan fill="#e6edf3">                               </tspan><tspan fill="#3fb950">●</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#3fb950">ONLINE</tspan><tspan fill="#7d8590">   </tspan><tspan fill="#7d8590">2026-05-14 02:41:00</tspan><tspan fill="#7d8590">   </tspan><tspan fill="#7d8590">HOME </tspan><tspan fill="#e6edf3">3237998081</tspan></text>
<text x="14" y="45.0" textLength="873.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#39c5cf">── </tspan><tspan fill="#e6edf3" font-weight="700">ENGINE</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#39c5cf">──────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="14" y="63.0" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#39c5cf">AUTO-PING</tspan><tspan fill="#7d8590">  — the engine&#39;s autonomous probes · automatic remediation: none admitted (DESIGN §3.5)</tspan></text>
<text x="14" y="81.0" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#3fb950">running</tspan><tspan fill="#7d8590">  · last pass &lt;1m ago</tspan><tspan fill="#7d8590">  · dwell 10m, max 3/outage</tspan><tspan fill="#7d8590">, sweep 120m</tspan></text>
<text x="14" y="99.0" textLength="546.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#7d8590">candidates </tspan><tspan fill="#e6edf3">9</tspan><tspan fill="#7d8590">  dead </tspan><tspan fill="#e6edf3">0</tspan><tspan fill="#7d8590">  sweep-due </tspan><tspan fill="#e6edf3">2</tspan><tspan fill="#7d8590"> (stalest 1.6h)</tspan><tspan fill="#7d8590">  verify-owed </tspan><tspan fill="#e6edf3">0</tspan></text>
<text x="14" y="117.0" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#7d8590">○ no node is in a dead episode, a miss streak, or a launch failure.</tspan></text>
<text x="14" y="135.0" textLength="705.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#39c5cf">REFRESH TRIAL</tspan><tspan fill="#7d8590">  — pre-registered experiment (DESIGN §3.5) · running it admits nothing</tspan></text>
<text x="14" y="153.0" textLength="378.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#3fb950">running</tspan><tspan fill="#7d8590">  · waiting: no rtt-degraded episode</tspan></text>
<text x="14" y="171.0" textLength="730.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#7d8590">eligible nodes: 3 of 9 mains — a refresh must send more than the probe&#39;s one Get (P5)</tspan></text>
<text x="14" y="189.0" textLength="814.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  treated 7/30 (4 improved) · held 6/30 (1 improved) · unscoreable 2+1 · lost 1+0 · 2 in 24h · </tspan><tspan fill="#7d8590">+1</tspan></text>
<text x="14" y="225.0" textLength="495.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#39c5cf">LEDGER — LIVE</tspan><tspan fill="#7d8590">  — episodes the engine is measuring right now</tspan></text>
<text x="14" y="243.0" textLength="697.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#7d8590">○ no open episodes. Nothing is being measured (this is the healthy steady state).</tspan></text>
<text x="14" y="279.0" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#39c5cf">LEARNED</tspan><tspan fill="#7d8590">  — every rate with the n behind it</tspan></text>
<text x="14" y="297.0" textLength="613.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#7d8590">  n≈ is recent-weighted and saturates near 33; node counts are cumulative</tspan></text>
<text x="14" y="315.0" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3">dead-flap</tspan></text>
<text x="14" y="333.0" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">self-heal not yet measured</tspan></text>
<text x="14" y="351.0" textLength="294.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">○ </tspan><tspan fill="#7d8590">3 unscoreable (thin evidence)</tspan></text>
<text x="14" y="369.0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3">weak-signal</tspan></text>
<text x="14" y="387.0" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">self-heal not yet measured</tspan></text>
<text x="14" y="405.0" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">○ </tspan><tspan fill="#7d8590">2 refused as misdiagnosis</tspan></text>
<text x="14" y="423.0" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3">rtt-degraded</tspan></text>
<text x="14" y="441.0" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#e6edf3">self-heal 44%</tspan><tspan fill="#7d8590"> (n≈9.0, 5 nodes, n≈1.0 worse)</tspan></text>
<text x="14" y="459.0" textLength="646.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">ladder ping n≈6.4, 3 nodes</tspan><tspan fill="#e6edf3"> · </tspan><tspan fill="#7d8590">shown, never claimed</tspan><tspan fill="#e6edf3"> · </tspan><tspan fill="#7d8590">last scored 48.0h ago</tspan></text>
<text x="14" y="477.0" textLength="537.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">○ live ≥10m: 21/28 scored in 30 d from 4 nodes (node 12: 11)</tspan></text>
<text x="14" y="495.0" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3">node-down</tspan></text>
<text x="14" y="513.0" textLength="646.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">○ not scored by design — no control arm is possible. See its REMEDY card.</tspan></text>
<text x="14" y="531.0" textLength="126.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3">missed-report</tspan></text>
<text x="14" y="549.0" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">○ not scored by design — see its REMEDY card.</tspan></text>
<text x="14" y="567.0" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3">repeated-frames</tspan></text>
<text x="14" y="585.0" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7d8590">○ not scored by design — see its REMEDY card.</tspan></text>
<text x="14" y="873.0" textLength="302.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">[Z]</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">PAUSE</tspan><tspan fill="#7d8590">   </tspan><tspan fill="#39c5cf" font-weight="700">[1-9]</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">SCREENS</tspan><tspan fill="#7d8590">   </tspan><tspan fill="#39c5cf" font-weight="700">[Q]</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">BACK</tspan></text>
</g>

name: "Z-Wave TUI"
version: "0.35.0"
slug: zwave_tui
description: "Telnet control-room TUI for Z-Wave mesh/node health"
url: https://github.com/tesseractAZ/zwave
arch:
  - aarch64
  - amd64
# Prebuilt multi-arch images, published by publish-release.yml on every release
# tag and verified anonymously pullable before this key was added.
#
# `{arch}` is expanded by Supervisor to aarch64/amd64, matching the two packages
# the workflow pushes. Home Assistant now PULLS the add-on instead of running the
# Dockerfile locally, so installs and updates take seconds rather than minutes of
# on-device npm build.
#
# The order this arrived in was deliberate and is worth preserving: the images
# were published FIRST, made public, and proven pullable with an anonymous
# registry token, and only then was this key added. Declaring `image:` against a
# package that is missing or private makes Supervisor pull a tag it cannot fetch,
# and EVERY install and update fails — whereas publishing images nobody consumes
# is harmless. configContract.test.ts pins the pair: if this key is present it
# must name exactly what the workflow pushes.
image: ghcr.io/tesseractaz/{arch}-zwave-tui
startup: services
boot: auto
stage: experimental
# HA's `init: true` default wraps the container with Docker's tini, making
# tini PID 1. The HA base image already ships its own s6-overlay init at
# /init; with tini in front, s6-overlay-suexec sees it isn't PID 1 and
# refuses to start (crash loop with "fatal: can only run as pid 1"). Turn
# tini off so our /init (s6) runs as PID 1 — mandatory for any add-on built
# on the official HA base images.
init: false
host_network: false
# Only the telnet TUI port is published on the LAN. The web console (:8788) is
# reached through HA Ingress (below), not a mapped host port.
ports:
  "2324/tcp": 2324
ports_description:
  "2324/tcp": "Telnet TUI (NO AUTH — keep on a trusted LAN). Change the LAN port here, in Network."
# HA Ingress: makes the browser terminal appear as a sidebar item inside Home
# Assistant (visible in the HA mobile app), authenticated through HA's normal
# session. Same server, same port — HA's hassio_ingress reverse-proxies in.
ingress: true
ingress_port: 8788
panel_icon: mdi:z-wave
panel_title: "Z-Wave TUI"
# ADMIN-ONLY. The console can remove a failed node, rebuild every route, and —
# with write actions on — unlock a lock and open a garage door. `false` exposed
# that panel to every HA user, while the add-on treats "arrived via ingress" as
# full operator authority: the only authorization the mesh-mutating console
# received was "HA let this browser through", a bar this setting had lowered to
# non-admins. The official Z-Wave JS add-on takes the same position
# (require_admin: true).
panel_admin: true
map:
  - data:rw
# Request access to Home Assistant's Core WebSocket/REST API so the add-on can
# issue zwave_js/* commands (network_status, node/controller statistics
# subscriptions, node_status/metadata) and call_service (button.press for ping).
# Without this flag SUPERVISOR_TOKEN is not granted access to /core/* and every
# zwave_js call fails.
homeassistant_api: true
# No Supervisor-level calls are made — everything goes through the Core API
# above, so the Supervisor API stays off.
hassio_api: false
# Per-field labels + help render on the Configuration page from
# translations/en.yaml. Order below = the order shown in the HA form.
options:
  # Order here = the order shown on the Configuration page, grouped from the
  # everyday settings at the top down to the advanced ones at the bottom.
  # ── Display & safety ───────────────────────────────────────────────────────
  signal_display: margin
  write_actions_enabled: false
  # ── Self-healing (auto-ping) ───────────────────────────────────────────────
  # OFF by default. This is the ONLY thing the engine does without a human
  # pressing a key, and it still obeys write_actions_enabled.
  auto_ping_enabled: false
  auto_ping_after_min: 10
  auto_ping_max_attempts: 3
  auto_ping_stale_min: 120
  # ── Telnet access ──────────────────────────────────────────────────────────
  telnet_enabled: true
  # ── Login gate (guards DIRECT/telnet; HA-sidebar access is already authed) ──
  auth_enabled: false
  auth_require_on_ingress: false
  users: []
  auth_max_attempts: 3
  auth_idle_lock_min: 0
  # ── Advanced (safe defaults — leave as-is unless you know you need them) ────
  refresh_interval: 2
  route_poll_interval: 10
  log_level: info
  zwave_entry_id: ""
  ha_ws_url: ws://supervisor/core/websocket
  driver_ws_url: ws://core-zwave-js:3000
schema:
  # KEEP THIS ORDER IN LOCK-STEP WITH options: above — HA renders the form in
  # schema order, and matching the two keeps the file readable.
  signal_display: list(margin|dbm)
  write_actions_enabled: bool
  auto_ping_enabled: bool
  auto_ping_after_min: int(2,120)
  auto_ping_max_attempts: int(1,10)
  auto_ping_stale_min: int(0,1440)
  telnet_enabled: bool
  auth_enabled: bool
  auth_require_on_ingress: bool
  # `users` is a repeatable {username, password} row; password renders masked.
  # The value may be plaintext or a scrypt:<salt>:<hash> string (see DOCS.md).
  users:
    - username: str
      password: password
  auth_max_attempts: int(1,10)
  auth_idle_lock_min: int(0,240)
  refresh_interval: int(1,30)
  route_poll_interval: int(5,120)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  # str? (not url?) on purpose: HA's voluptuous url? rejects an empty default on
  # Save, and both ship empty / with a ws:// scheme. The runtime validates them.
  # Do not "tidy" these to url?.
  zwave_entry_id: "str?"
  ha_ws_url: "str?"
  # READ-ONLY zwave-js driver telemetry (noise floor / lastSeen / capability
  # flags). str? not url? for the same voluptuous reason as above — and empty
  # DISABLES the client entirely. Never used for actions.
  driver_ws_url: "str?"

# Etiquetas y ayuda en línea de la página de Configuración del complemento
# Z-Wave TUI (español latinoamericano).
#
# Home Assistant muestra `name` como la etiqueta del campo y `description` como
# el texto de ayuda debajo. Las CLAVES deben coincidir EXACTAMENTE con las de
# config.yaml: un error de escritura no genera ninguna advertencia — HA muestra
# la clave cruda en su lugar. Las etiquetas de los puertos viven en
# `ports_description:` dentro de config.yaml, así que aquí no hay bloque
# `network:`.
#
# ★ LA ESTRUCTURA LA LLEVA EL PREFIJO DE LA ETIQUETA ("Pantalla · ",
#   "Seguridad · ", "Acceso · ", "Inicio de sesión · ", "Avanzado · "), NO el
#   anidamiento de las claves. Es una decisión deliberada y permanente, no un
#   atajo — y es la misma regla que en en.yaml, por el mismo motivo:
#
#   un complemento NO tiene un mecanismo de migración de opciones, así que
#   anidar una clave equivale a RENOMBRARLA. El valor del operador queda en la
#   ruta ANTIGUA, que ya no existe en el nuevo esquema, mientras que la ruta
#   nueva nunca se escribió y por lo tanto toma su valor predeterminado. En una
#   instalación con `auth_enabled: true` y `write_actions_enabled: true`, eso
#   devolvería silenciosamente la puerta de inicio de sesión a `false` mientras
#   las acciones de escritura siguen ACTIVAS: un puerto telnet sin autenticar (hasta v0.76)
#   con bloqueo/desbloqueo de cerraduras disponible.
#
#   Por eso: NUNCA anide ni renombre una clave existente para ordenar este
#   formulario. Traducir el TEXTO es seguro; tocar las CLAVES no lo es.
#
# Nota de traducción: los valores literales de configuración ("margin", "dbm"),
# la palabra que se escribe para confirmar (CONFIRM) y las letras de las teclas
# (A, T) NO se traducen — son lo que el operador debe escribir o ver en
# pantalla. Los estados del controlador Z-Wave (Alive / Dead) se dejan en
# inglés entre paréntesis porque así aparecen en la interfaz.
configuration:
  # ── Pantalla y seguridad ────────────────────────────────────────────────────
  signal_display:
    name: Pantalla · Unidad de señal
    description: >-
      Unidad predeterminada para la calidad del enlace en la TUI. "margin"
      muestra el margen de señal sobre el piso de ruido medido en vivo
      (recomendado); "dbm" muestra el RSSI crudo. Puede cambiarla en cualquier
      momento dentro de la TUI: presione T (aparece como [T] UNITS en la barra
      de comandos).
  write_actions_enabled:
    name: Seguridad · Habilitar acciones de escritura
    description: >-
      Desbloquea el menú de acciones (presione A en la TUI): ping, actualizar
      valores, volver a entrevistar, reconstruir rutas, eliminar un nodo
      fallido, control de dispositivos (encender/apagar, abrir/cerrar,
      bloquear/desbloquear) y escritura de configuración. Desactivado, el
      complemento es un monitor de solo lectura. Es seguro dejarlo activado:
      cada comando que llega a la malla, salvo el atajo de ping de una sola
      tecla (p), debe armarse escribiendo la palabra CONFIRM antes de
      ejecutarse. Las recomendaciones del motor nunca se ejecutan solas; solo
      el ping automático, más abajo, actúa sin que se presione una tecla.
  # ── Autorreparación (auto-ping) ─────────────────────────────────────────────
  auto_ping_enabled:
    name: Seguridad · Hacer ping automático a un nodo caído
    description: >-
      DESACTIVADO de forma predeterminada. Cuando un nodo ALIMENTADO POR RED
      lleva caído (Dead) el tiempo de espera indicado abajo, el motor le envía
      pings, hasta el número de intentos indicado abajo, para intentar
      despertarlo. Los dispositivos a batería o dormidos
      nunca se tocan: dormido no es lo mismo que caído, y un ping no puede
      alcanzarlos antes de su propio despertar. Requiere "Habilitar acciones de
      escritura". Se suspende durante una reconstrucción de rutas o la
      eliminación de un nodo fallido, en la ventana
      de reinicio (para un nodo caído, solo hasta que el listado de nodos esté
      listo), mientras la radio del controlador está apagada (como durante su
      respaldo nocturno de NVM) y cuando una cuarta parte de la malla está caída
      a la vez (eso
      es un problema del controlador, no de un dispositivo). Cada intento queda
      registrado. Si pone fin a una caída no se califica (una caída termina
      cuando el dispositivo vuelve, así que no hay con qué compararlo), y lo que
      aprenden sus pings se muestra en ENGINE en su propia fila y nunca se
      presenta como una solución. Presione Z en la pantalla ENGINE para
      pausarlo todo a la vez.
  auto_ping_after_min:
    name: Seguridad · Ping automático después de (minutos caído)
    description: >-
      Cuánto tiempo debe llevar un nodo caído (Dead) de forma continua antes del
      primer ping automático. No se aplica cuando un nodo cae mientras el
      propio sondeo de vida o de verificación del complemento hacia él sigue
      sin respuesta: nada
      lo recupera, así que se sondea de inmediato y, cuando se recupera, no
      recibe sondeos de vida ni de verificación durante 15 minutos.
  auto_ping_max_attempts:
    name: Seguridad · Intentos de ping automático por caída
    description: >-
      Intentos por episodio de caída, espaciados 10/30/60 minutos (con el valor
      predeterminado de 3 solo se alcanzan las esperas de 10 y 30 minutos: unos
      50 minutos desde la caída hasta el aviso, unos 40 si el nodo cayó durante
      uno de los propios sondeos del complemento). Después de eso el motor se
      detiene y le deja el nodo a usted. Una recuperación reinicia la cuenta.
      Cada ping sin respuesta va seguido de una lectura con enrutamiento cuando
      el dispositivo tiene un valor de interruptor/luz que leer: un solo Get,
      que no cambia nada en el dispositivo y que se omite después de dos
      recuperaciones de ese nodo por esta vía en 24 horas. Se envía porque un
      ping solo puede usar las rutas guardadas y un comando real puede
      encontrar una nueva.
  auto_ping_stale_min:
    name: Seguridad · Intervalo del sondeo de vida (minutos)
    description: >-
      Consulta cada nodo alimentado por red que no esté ya caído una vez cada
      tantos minutos como indica este valor (0 lo desactiva), con una lectura
      con enrutamiento — un solo Get sobre el valor de interruptor/luz del
      propio dispositivo, que no cambia nada en el dispositivo y que el
      controlador puede enrutar; su respuesta puede corregir un estado obsoleto
      de Home Assistant, lo que puede disparar automatizaciones — o con un ping
      NoOp si el dispositivo no tiene ese valor, o durante 30 minutos después de
      que una lectura no pudo enviarse. Z-Wave
      marca un nodo como caído (Dead) solo cuando un envío hacia él FALLA, de
      modo que un dispositivo al que nadie le habla nunca se comprueba: un
      tomacorriente desenchufado puede figurar como Alive indefinidamente; y un
      solo ping sin respuesta puede marcar como caído uno que funciona, por eso
      el sondeo lee. Todos los nodos se
      consultan con la misma cadencia, conversadores o no, así que su
      proporción de respuestas mide si son alcanzables y no cuánto hablan. Un
      sondeo por ciclo, empezando por el más antiguo, con las mismas
      suspensiones que el ping automático.
  refresh_trial_enabled:
    name: Seguridad · Ensayo de refresco (experimento prerregistrado)
    description: >-
      DESACTIVADO por defecto. Ejecuta el ensayo aleatorizado prerregistrado de
      DESIGN §3.5: cuando un episodio rtt-degraded de un nodo alimentado por red
      lleva 10 minutos activo y nada ha actuado sobre él, el motor lanza una
      moneda; si sale cara envía a ese nodo un "refresco de valores"
      (zwave_js/refresh_node_values — lecturas de cada valor de interruptor,
      luz y sensor, que pueden corregir estados obsoletos de Home Assistant y
      así disparar automatizaciones); si sale cruz no envía nada. Solo participa
      un nodo cuyo refresco pide más que la única lectura de la sonda; en una
      malla de interruptores y atenuadores simples ninguno lo hace, y el ensayo
      no envía nada (ENGINE muestra cuántos nodos son elegibles). Ambas mitades
      se puntúan igual entre 20 y 30 minutos después de la decisión, aparte de
      todo lo demás que aprende el motor, hasta que 30 decisiones en cada una
      den el único veredicto (o pasen 120 días). Como máximo una decisión por
      nodo al día, dos por hora y seis al día, solo de 09:00 a 20:00, una a la
      vez, nunca dentro de los 10 minutos siguientes a una acción suya, y solo
      mientras auto-ping funcione sin pausa — por eso también requiere
      "Habilitar acciones de escritura" y auto-ping. Un nodo que queda caído
      (Dead) dentro de los 5 minutos siguientes a un refresco queda excluido 7
      días; una segunda muerte así dentro de 7 días detiene el ensayo hasta que
      el complemento se inicie con esta opción desactivada. Pulse Z en la
      pantalla ENGINE para pausarlo junto con todo lo demás. Ejecutar el ensayo
      no admite nada: aprobarlo solo hace revisable un refresco automático.
  log_archive_days:
    name: Registros · Días de archivo
    description: >-
      Días de registros que se guardan en el archivo propio del complemento,
      incluido hoy (0 lo desactiva y borra lo que escribió). El journal del host solo conserva alrededor
      de un día y medio del registro de cada aplicación; este archivo guarda por
      más tiempo el registro del complemento y el flujo de registro del
      controlador Z-Wave JS, en archivos diarios en la carpeta de configuración
      del complemento (/addon_configs/<slug del complemento>/logs, legible por
      SSH). Los días terminados se comprimen con gzip y entran en las copias de
      seguridad del complemento; el archivo de hoy no.
  log_archive_max_mb:
    name: Registros · Tamaño máximo del archivo (MB)
    description: >-
      El máximo de disco que puede usar el archivo. Al superarlo se borran
      primero los archivos completos más antiguos; los de hoy nunca.
  log_archive_driver:
    name: Registros · Archivar el registro del controlador Z-Wave JS
    description: >-
      Guarda también el flujo de registro del controlador Z-Wave JS (al nivel de
      registro del propio controlador), no solo el registro de este
      complemento. Los códigos de usuario y de administrador de cerraduras, los
      PIN, los DSK de SmartStart, las cadenas hexadecimales con forma de clave y
      los tokens se ocultan antes de escribir nada. Desactivado guarda solo el
      registro del complemento.
  # ── Acceso por SSH ──────────────────────────────────────────────────────────
  ssh_enabled:
    name: Acceso · Habilitar la TUI por SSH
    description: >-
      Publica la TUI de pantalla completa por SSH en el puerto del complemento
      (2324) para terminales de su red local: ssh -p 2324 <usuario>@<host>. El
      inicio de sesión usa un usuario y contraseña de la puerta de abajo, así
      que actívela y agregue un usuario; con la puerta desactivada se rechaza
      todo inicio de sesión. La huella de la clave del host está en el registro
      del complemento.
  # ── Puerta de inicio de sesión ──────────────────────────────────────────────
  auth_enabled:
    name: Inicio de sesión · Exigir inicio de sesión (acceso directo)
    description: >-
      Exige usuario y contraseña para el acceso DIRECTO: por SSH o entrando
      al puerto directamente. El acceso por la barra lateral de Home Assistant
      ya está autenticado por HA y no se restringe (salvo que active también la
      opción siguiente). Agregue al menos un usuario abajo primero: sin ninguno
      configurado, el acceso directo se deniega.
  auth_require_on_ingress:
    name: Inicio de sesión · Exigirlo también en la barra lateral de HA
    description: >-
      Muestra también la puerta de inicio de sesión al abrir la consola desde la
      barra lateral de Home Assistant. No tiene efecto si "Exigir inicio de
      sesión (acceso directo)" no está activado también. Desactivado de forma
      predeterminada (HA
      ya lo autenticó allí); actívelo solo si quiere un segundo aviso delante de
      los controles de la malla.
  users:
    name: Inicio de sesión · Usuarios
    description: >-
      Cuentas permitidas para la TUI: agregue una fila por usuario. La
      contraseña puede ir en texto plano (se oculta aquí, pero se guarda en las
      opciones del complemento) o como una cadena scrypt:<salt>:<hash> para no
      almacenar texto plano. Un hash es scrypt:, una sal aleatoria de 16 bytes
      en hexadecimal, dos puntos y la clave scrypt de 32 bytes en hexadecimal
      (N=16384, r=8, p=1, los valores predeterminados de crypto.scryptSync de
      Node).
  auth_max_attempts:
    name: Inicio de sesión · Intentos máximos
    description: >-
      Intentos de contraseña fallidos permitidos antes de cerrar la conexión.
      Predeterminado 3.
  auth_idle_lock_min:
    name: Inicio de sesión · Bloqueo por inactividad (minutos)
    description: >-
      Vuelve a exigir el inicio de sesión tras estos minutos sin pulsaciones de
      teclas en una sesión ya iniciada. 0 lo desactiva. Se aplica solo a las
      sesiones que pasaron por la puerta de inicio de sesión; a las de la barra
      lateral de HA, solo si "Exigirlo también en la barra lateral de HA" está
      activado.
  # ── Avanzado ────────────────────────────────────────────────────────────────
  refresh_interval:
    name: Avanzado · Intervalo de actualización (segundos)
    description: >-
      Segundos entre cada redibujado en vivo y el sondeo ligero del listado de
      nodos (network_status). El valor predeterminado de 2 s es un buen
      equilibrio: menos es más ágil, más es más liviano. Rango 1–30.
  route_poll_interval:
    name: Avanzado · Intervalo de sondeo de rutas (segundos)
    description: >-
      Segundos entre los sondeos más pesados de rutas y estadísticas del
      controlador, mantenidos fuera del ciclo rápido de dibujado para que no
      castiguen la malla. Predeterminado 10 s. Rango 5–120.
  log_level:
    name: Avanzado · Nivel de registro
    description: >-
      Detalle del registro del complemento. "info" es el valor predeterminado;
      use debug o trace para diagnosticar, o warning/error para silenciar la
      salida de rutina.
  zwave_entry_id:
    name: Avanzado · ID de entrada de Z-Wave JS
    description: >-
      Déjelo en blanco para detectar automáticamente la integración zwave_js
      (recomendado: sobrevive a que se vuelva a agregar la integración).
      Especifique un id de entrada de configuración explícito solo si tiene más
      de una entrada zwave_js.
  ha_ws_url:
    name: Avanzado · URL del WebSocket de Home Assistant
    description: >-
      Déjelo en el valor predeterminado ws://supervisor/core/websocket para una
      instalación normal. Cámbielo solo para apuntar la capa de datos a otro
      Home Assistant Core, nunca al WebSocket del controlador (para eso está la
      URL del controlador, a continuación): la capa de datos usa los comandos
      zwave_js de Home Assistant, que el servidor del controlador no atiende.
  driver_ws_url:
    name: Avanzado · URL del WebSocket del controlador Z-Wave JS (telemetría de solo lectura)
    description: >-
      Conexión directa de SOLO LECTURA al controlador Z-Wave JS para
      diagnósticos que Home Assistant no reenvía: el piso de ruido de fondo por
      canal (márgenes de señal reales y detección de interferencias), las horas
      verdaderas de último contacto y los indicadores de capacidad de los
      dispositivos. El valor predeterminado ws://core-zwave-js:3000 corresponde
      al complemento oficial de Z-Wave JS; quienes usen Z-Wave JS UI deben
      apuntarlo al puerto WS de su servidor. Déjelo VACÍO para desactivarlo. El
      complemento sigue supervisando a través de Home Assistant, pero sin los
      indicadores de capacidad de los dispositivos y el flujo de registro que
      aporta esta conexión, el ping automático y el sondeo de vida no pueden
      ejecutarse, y los detectores quiet-node, missed-report, s2-desync y
      repeated-frames quedan en silencio. Esta conexión nunca se usa para
      controlar la malla.

name: CI

# Type-check + test the server and smoke-build the add-on container on every
# push and PR. Cheap insurance that no broken commit lands on main and gets
# installed onto the Pi.
#
# NOTE: this is the gate the release process waits on BY CONVENTION. `main` has
# no branch protection and no ruleset, so nothing mechanically prevents a merge
# while these checks are red — the maintainer merges with `--squash --admin`.
# Calling it "the required check" (as this comment did) overstated it. To make
# it genuinely required, add a branch-protection rule on `main` requiring
# "Type-check & test (server)" and the smoke builds, leaving admin bypass ON so
# a solo maintainer can still land an urgent fix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: both jobs only read the repo (checkout). Buildx GHA cache
# uses the runtime token, not GITHUB_TOKEN, so no extra scopes are needed.
permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check & test (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zwave_tui/server/package-lock.json

      - name: Install
        working-directory: zwave_tui/server
        run: npm ci

      - name: Type-check
        working-directory: zwave_tui/server
        run: npm run typecheck

      - name: Test
        working-directory: zwave_tui/server
        run: npm test

  docker-smoke:
    # Build the Home Assistant add-on container on every push/PR, for EVERY
    # architecture config.yaml declares. Previously this built amd64 only —
    # which meant aarch64, the one architecture actually deployed (a Pi 5), was
    # never compiled in CI, so an arch-specific Dockerfile or apk regression
    # would have reached the Pi unseen. Buildx cache keeps repeat runs ~1-2 min.
    #
    # The build context is ./zwave_tui, matching what HA Supervisor uses: an
    # add-on is built from ITS OWN directory, not the repository root.
    name: Dockerfile smoke build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        if: matrix.arch != 'amd64'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Read BUILD_FROM from build.yaml rather than hardcoding it here. The two
      # used to be duplicated with nothing checking they agreed, so CI could go
      # on smoke-building a base image the add-on no longer uses.
      # ARCH goes through the environment, never straight into the script body.
      # `${{ }}` is expanded by the runner BEFORE bash sees the line, so
      # interpolating any input directly into `run:` splices text into the
      # script. matrix.arch is a trusted literal from this file, but the shape
      # is the one that bites when the value later comes from somewhere else.
      - name: Resolve BUILD_FROM from build.yaml
        id: base
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          img=$(awk -v arch="$ARCH" '
            /^build_from:/      { inblock = 1; next }
            inblock && /^[^[:space:]]/ { inblock = 0 }
            inblock && $1 == arch":" { print $2; found = 1; exit }
            END { if (!found) exit 1 }
          ' zwave_tui/build.yaml) || {
            echo "::error::no build_from entry for '$ARCH' in zwave_tui/build.yaml"
            exit 1
          }
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "BUILD_FROM($ARCH) = $img"

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./zwave_tui
          file: ./zwave_tui/Dockerfile
          platforms: linux/${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
          push: false
          load: false
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=ci
            BUILD_DESCRIPTION=Z-Wave TUI (smoke)
            BUILD_NAME=Z-Wave TUI
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=ci
          # ignore-error=true so a flaky GHA cache doesn't fail the smoke build.
          cache-from: type=gha,scope=docker-smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-smoke-${{ matrix.arch }},ignore-error=true

  docs:
    # Assemble README + SECURITY + zwave_tui/DOCS.md into one printable manual on
    # every push/PR, as BOTH an editable .docx (pandoc) and a reader-friendly
    # .pdf (LibreOffice converts the .docx — no LaTeX). Purpose: (1) fail the PR
    # if DOCS.md no longer converts cleanly, and (2) upload a downloadable offline
    # manual for the branch. publish-release.yml builds the same manual again and
    # attaches it to the GitHub Release; this job is the per-branch check.
    name: Build documentation (.docx + .pdf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # librsvg2-bin provides rsvg-convert, which pandoc needs to embed the SVG
      # screenshots into the .docx/.pdf — without it they are silently dropped.
      - name: Ensure pandoc + libreoffice + rsvg
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer-nogui librsvg2-bin
          pandoc --version | head -1
          soffice --version | head -1

      - name: Build .docx + .pdf
        run: |
          python3 scripts/build-docs-docx.py \
            --ref "${GITHUB_SHA:0:7}" \
            --pdf \
            --output "Z-Wave-TUI-Documentation.docx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation
          path: |
            Z-Wave-TUI-Documentation.docx
            Z-Wave-TUI-Documentation.pdf
          if-no-files-found: error

name: Publish release

# Cut a GitHub Release on a `v*.*.*` tag push — release notes from the
# CHANGELOG + the printable manual (.docx editable, .pdf reader-friendly) as
# assets. Deliberately does NOT publish a container image: this add-on is
# deployed by SOURCE BUILD (Supervisor builds it on the user's own device), so
# no GHCR package is ever pushed.
#
# NB the repo is PUBLIC, so a Release and its manual ARE public.
#
# To cut a release: after the version's PR is merged to main (subject `vX.Y…`,
# never `Release v`), push the tag at that merge commit:
#     git tag v0.21.0 <merge-sha> && git push origin v0.21.0
# This workflow then builds the manual and creates the Release.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)release, without leading v (e.g. 0.21.0)"
        type: string
        required: true

permissions:
  contents: write   # GitHub Release creation
  packages: write   # GHCR image push (v0.29.2 — see the `images` job)

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # Check out the version being RELEASED, not the default branch.
      #
      # On a tag push these are the same thing, so this looked fine. On a
      # workflow_dispatch they are not: the default checkout is main, so the
      # config.yaml-vs-tag guard below compared the REQUESTED version against
      # MAIN's config.yaml and refused everything except the version currently
      # on main — breaking the exact path that exists for re-releasing an older
      # tag. Found by using it: re-running the failed v0.29.0 release died with
      # "tag v0.29.0 does not match zwave_tui/config.yaml version '0.29.3'".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - id: v
        # INPUT_VERSION is passed through the ENVIRONMENT, never interpolated
        # into the script body. `${{ inputs.version }}` is substituted by the
        # runner as raw text BEFORE bash parses the line, so a dispatch value
        # like `"; curl … | sh; #` executed as shell — and it did so on the
        # line ABOVE the regex check, meaning the validation could never
        # protect anything. Only repo writers can dispatch this workflow, so
        # this was self-inflicted rather than remotely exploitable, but the
        # `contents: write` token made it worth closing regardless.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$v' (expected X.Y.Z)"
            exit 1
          fi
          # The tag and the shipped add-on version MUST agree. Nothing checked
          # this before, so tagging v0.25.0 at a commit whose config.yaml still
          # said 0.24.4 would have published a Release whose notes, manual and
          # asset names all disagreed with what a user actually installs.
          cfg=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' zwave_tui/config.yaml)
          if [[ "$cfg" != "$v" ]]; then
            echo "::error::tag v$v does not match zwave_tui/config.yaml version '$cfg' — bump the config or fix the tag"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "📦 Releasing v$v (config.yaml agrees)"

  test:
    name: Server tests
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zwave_tui/server/package-lock.json
      - name: Install server deps
        working-directory: zwave_tui/server
        run: npm ci
      - name: Run server tests
        working-directory: zwave_tui/server
        run: npm test
      - name: tsc --noEmit (server)
        working-directory: zwave_tui/server
        run: npx tsc --noEmit

  images:
    name: Build & push image (${{ matrix.arch }})
    needs: [resolve, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each arch builds on its NATIVE runner. GitHub's free ARM64 runners
          # for public repos remove the QEMU emulation path, which on the power
          # add-on routinely stretched aarch64 builds to 30-60 minutes.
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      # QEMU stays as a fallback if a native runner is unavailable; on a matched
      # host it is effectively a no-op.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read the base from build.yaml rather than hardcoding a matrix entry —
      # the same no-drift rule ci.yml's docker-smoke follows. Home Assistant
      # reads build.yaml when it builds from source, so a hardcoded base here
      # could silently ship an image built on a DIFFERENT runtime than the one
      # a source install gets.
      - name: Resolve BUILD_FROM from build.yaml
        id: base
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          img=$(awk -v arch="$ARCH" '
            /^build_from:/      { inblock = 1; next }
            inblock && /^[^[:space:]]/ { inblock = 0 }
            inblock && $1 == arch":" { print $2; found = 1; exit }
            END { if (!found) exit 1 }
          ' zwave_tui/build.yaml) || {
            echo "::error::no build_from entry for '$ARCH' in zwave_tui/build.yaml"
            exit 1
          }
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "BUILD_FROM($ARCH) = $img"

      - name: Lowercase repo owner (GHCR requires it)
        id: owner
        run: |
          echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./zwave_tui
          file: ./zwave_tui/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.arch }}-zwave-tui:${{ needs.resolve.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.arch }}-zwave-tui:latest
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_DESCRIPTION=Telnet control-room TUI for Z-Wave mesh/node health
            BUILD_NAME=Z-Wave TUI
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.resolve.outputs.version }}
          # ignore-error: a flaky GHA cache backend must not fail a release.
          cache-from: type=gha,scope=zwave-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=zwave-${{ matrix.arch }},ignore-error=true

  release:
    name: Cut GitHub Release + attach manual
    needs: [resolve, test, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          # Full history + tags: the --latest decision below compares this
          # version against EVERY released tag. At the default depth-1, no-tags
          # checkout, `git tag --list` sees only the tag being released, so it
          # would always look like the newest one.
          fetch-depth: 0

      - name: Skip if Release already exists
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.resolve.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ needs.resolve.outputs.tag }} already exists; skipping create"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # librsvg2-bin provides rsvg-convert, which pandoc needs to embed the SVG
      # screenshots into the .docx/.pdf — without it they are silently dropped.
      - name: Ensure pandoc + libreoffice + rsvg
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer-nogui librsvg2-bin
          pandoc --version | head -1
          soffice --version | head -1

      - name: Build the manual (.docx + .pdf)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 scripts/build-docs-docx.py --pdf \
            --version "${{ needs.resolve.outputs.version }}" \
            --ref "${{ github.sha }}" \
            --output "Z-Wave-TUI-Documentation-v${{ needs.resolve.outputs.version }}.docx"
          ls -la Z-Wave-TUI-Documentation-v${{ needs.resolve.outputs.version }}.*

      - name: Extract notes from CHANGELOG.md
        if: steps.gate.outputs.skip != 'true'
        env:
          NEXT: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/notes.md
          import os, re, sys
          version = os.environ["NEXT"]
          with open("zwave_tui/CHANGELOG.md") as f:
              content = f.read()
          pattern = re.compile(
              rf"^## {re.escape(version)}\b.*?(?=^## |\Z)",
              re.MULTILINE | re.DOTALL,
          )
          m = pattern.search(content)
          if m:
              body = m.group(0).split("\n", 1)[1].strip()
              print(body)
          else:
              # FAIL, don't paper over it. A Release whose notes read
              # "(see CHANGELOG.md)" looks deliberate, so a forgotten
              # CHANGELOG section shipped silently instead of being caught.
              sys.exit(f"no '## {version}' section in zwave_tui/CHANGELOG.md")
          PY
          echo "── notes preview ────────────────────────────"
          cat /tmp/notes.md
          echo "─────────────────────────────────────────────"

      - name: Create GitHub Release with the manual attached
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # --latest only when this really IS the newest version. It used to be
          # unconditional, so re-releasing an OLD tag (the workflow_dispatch
          # path exists precisely for that) would move the "Latest" badge
          # backwards and point new installs at a superseded add-on.
          newest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' \
                   | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [[ "$newest" == "$V" ]]; then latest=--latest; else latest=--latest=false; fi
          echo "newest tag = v${newest}; releasing v${V} with ${latest}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            "$latest" \
            "Z-Wave-TUI-Documentation-v${V}.docx" \
            "Z-Wave-TUI-Documentation-v${V}.pdf"

      - name: Summary
        # Reports what ACTUALLY happened. This used to print "✅ released"
        # unconditionally — including on the skip path — so a run that created
        # nothing still showed a green success summary.
        env:
          V: ${{ needs.resolve.outputs.version }}
          SKIPPED: ${{ steps.gate.outputs.skip }}
        run: |
          {
            if [[ "${SKIPPED:-}" == "true" ]]; then
              echo "## ⏭️ v${V} — release SKIPPED"
              echo
              echo "A release for this version already exists; nothing was created."
            else
              echo "## ✅ v${V} released"
              echo
              echo "A public GitHub Release was cut with the CHANGELOG notes and the"
              echo "printable manual (.docx + .pdf) attached. No container image was"
              echo "published — Supervisor builds the add-on from source on the host."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# CodeQL security scanning for the Z-Wave TUI add-on (JS/TS).
#
# The repo is PUBLIC, so GitHub code scanning is available at no cost and
# results are UPLOADED to the Security tab, alongside the Dependabot alerts.
#
# (History: while the repo was private under a personal account, GHAS was
# unavailable — "Advanced security has not been purchased" — so this workflow
# ran with `upload: false` and self-gated on a SARIF artifact. Going public made
# that workaround unnecessary; the upload is strictly better because a finding
# now surfaces in the Security tab instead of only inside a CI artifact nobody
# opens.)
#
# The artifact and the hard CI gate are DELIBERATELY KEPT. Upload alone is not
# a gate: code scanning surfaces a finding but does not fail the build, so
# without check-sarif.mjs a new vulnerability would merge green.
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '27 4 * * 1'   # weekly, Monday 04:27 UTC

permissions:
  contents: read
  actions: read            # CodeQL reads the workflow run for its analysis summary
  security-events: write   # REQUIRED to upload SARIF; without it the upload 403s

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # On 26.04 like every other job (v0.75.4). CodeQL's published system
    # requirements still list Ubuntu 22.04 and 24.04 only (2026-10-13), but it
    # runs here: the trial PR's analysis passed on 26.04 with no platform
    # warning, and the required check fails closed if that ever changes.
    runs-on: ubuntu-26.04
    # A pull request's analysis covers the whole codebase, not only the lines it
    # changed (v0.76.0). codeql-action v4 makes PR runs "diff-informed" by
    # default: a result is kept only when its source or sink sits on a changed
    # line, so a PR could pass while main's full scan finds the same flaw.
    # init reads this switch, and only the exact value "false" turns it off
    # (codeql-action src/feature-flags.ts). check-sarif.mjs refuses a
    # diff-informed SARIF, so the gate cannot quietly narrow again.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended   # broader than default: more CodeQL-class rules
          # Exclude the test suite from ANALYSIS (not from the repo — the image
          # does ship zwave_tui/server/test, it just never executes it). Test code is not
          # attack surface, and treating it as a taint SOURCE produced findings
          # about production code that cannot happen in production: both
          # `js/insecure-temporary-file` hits (sev 7.0, on historyStore.ts and
          # outcomes.ts) traced to tests passing an os.tmpdir() path into the
          # store. At runtime that path is always /data — the add-on's own
          # private volume — so the atomic write-then-rename is correct there.
          config: |
            paths-ignore:
              - zwave_tui/server/test/**
      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - name: Perform CodeQL Analysis (uploads to the Security tab)
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          # `always` also writes the SARIF locally, so the artifact + the CI
          # gate below keep working exactly as before.
          upload: always
          output: sarif-results
      - name: Publish SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: warn
      - name: Fail on actionable CodeQL findings
        run: node .github/scripts/check-sarif.mjs sarif-results/javascript.sarif

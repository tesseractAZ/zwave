name: Tag released version

# Post-merge half of the release pipeline (mirrors the power add-on's chain).
#
# Until v0.29.2 this link did not exist, and the consequence was not theoretical:
# v0.29.0 and v0.29.1 were both merged to main and sat UNTAGGED and unreleased,
# because `publish-release.yml` only fires on a pushed tag and nothing pushed
# one. Tagging was a manual step that looked automatic.
#
# Now: when a commit whose subject starts with "Release v" lands on main AND it
# touches the add-on's config.yaml, this workflow reads the version out of
# config.yaml, creates the matching tag, and starts the release.
#
# Why it dispatches publish-release.yml instead of relying on the tag push:
# a tag pushed with the default GITHUB_TOKEN does NOT trigger other workflows —
# GitHub's recursion guard. `workflow_dispatch` via the API is exempt, so we
# create the tag and then start the release explicitly. Miss this and the tag
# appears but no release ever runs, which is a silent half-failure.
#
# NOTE: publish-release.yml does the rest — it builds and pushes the multi-arch
# GHCR images, then cuts the GitHub Release with the .docx/.pdf manual attached.

on:
  push:
    branches: [main]
    paths:
      - 'zwave_tui/config.yaml'

permissions:
  contents: write   # create + push the tag
  actions: write    # dispatch publish-release.yml

jobs:
  tag:
    name: Tag + start the release
    # Only act on a release commit. Any other config.yaml edit (a new option, a
    # description tweak) must NOT cut a release.
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create the tag and start the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          v=$(grep -E '^version:' zwave_tui/config.yaml \
            | sed -E 's/version:[[:space:]]*"?([^"#]+)"?.*/\1/' \
            | tr -d '[:space:]')
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse version from zwave_tui/config.yaml (got '$v')"
            exit 1
          fi

          # The suite pins these two together (configContract: "server/package.json
          # version tracks the add-on version"). Re-check it here anyway: this
          # workflow is what turns a version into a PUBLIC release, and shipping a
          # tag whose payload disagrees with itself is worse than not shipping.
          pkg=$(node -p "require('./zwave_tui/server/package.json').version")
          if [[ "$pkg" != "$v" ]]; then
            echo "::error::config.yaml ($v) and server/package.json ($pkg) disagree — refusing to tag."
            exit 1
          fi

          tag="v${v}"

          # Idempotent: a re-run, or a "Release v" commit that did not actually
          # change the number, must be a no-op rather than a failure.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::Tag ${tag} already exists — nothing to do."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "Tagged ${tag}."

          # See the header: the tag push above cannot trigger publish-release.yml
          # by itself, so start it here.
          gh workflow run publish-release.yml -f version="${v}"
          echo "Dispatched publish-release.yml for ${v}."

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🏷️ Tag-release"
            echo
            echo "If a new \`v*\` tag was created above, **\`publish-release.yml\`** is now"
            echo "building the amd64 + aarch64 GHCR images and cutting the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
